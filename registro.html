<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><title>Crear cuenta | RetroSport Legends</title></head>
<body data-p="registro"><main><form data-f="registro"><h1>Crea tu cuenta</h1>
<label>Nombre completo<input name="nombre" required autocomplete="name"></label>
<label>Correo electrónico<input name="email" type="email" required autocomplete="email"></label>
<label>WhatsApp<input name="tel" type="tel" required autocomplete="tel" placeholder="300 000 0000"></label>
<label>¿Cómo nos conociste?<select name="origen"><option>WhatsApp</option><option>Instagram</option><option>TikTok</option><option>Un amigo</option><option>Otro</option></select></label>
<label>Contraseña<input name="pass" type="password" required minlength="6" autocomplete="new-password"></label>
<label class="chk"><input type="checkbox" required>Autorizo el tratamiento de mis datos personales para gestionar mis compras y recibir novedades.</label>
<p class="msg" role="alert"></p><button class="btn">Crear cuenta</button><p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p></form></main><script src="app.js"></script></body></html>
